<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار PRO — آخر التحديثات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#060d1f;--card:#0d1630;--border:#1a3360;--blue:#2563eb;--blue-light:#3b82f6;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Tajawal',sans-serif;color:var(--text);min-height:100vh}
.topbar{background:#0a1020;border-bottom:2px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:900;color:#fff}.logo span{color:var(--blue-light)}
.logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:7px;font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer}
.logout:hover{border-color:var(--blue-light);color:var(--blue-light)}
.header{padding:26px 20px 8px;text-align:center}
.header h1{font-size:22px;font-weight:900;color:#fff}
.header p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.8;max-width:480px;margin-left:auto;margin-right:auto}
.list{padding:20px 16px;display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.model-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;transition:all 0.2s}
.model-card:hover{border-color:var(--blue-light);transform:translateY(-2px);box-shadow:0 4px 20px rgba(37,99,235,0.2)}
.model-name{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.new-badge{font-size:10px;font-weight:900;color:#6ee7b7;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);padding:3px 9px;border-radius:20px}
.model-brand{font-size:11px;color:var(--blue-light);background:rgba(37,99,235,0.12);padding:3px 10px;border-radius:10px;white-space:nowrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.8}
.continue-wrap{padding:10px 20px 40px;max-width:640px;margin:0 auto}
.continue-btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;border:none;border-radius:10px;padding:15px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:900;cursor:pointer;text-decoration:none;box-shadow:0 4px 20px rgba(37,99,235,0.3)}
</style>
</head>
<body>
<script type="module" src="auth-guard.js"></script>
<div class="topbar">
  <div class="logo">مسار <span>PRO</span></div>
  <button class="logout" onclick="signOut()">خروج ←</button>
</div>

<div class="header">
  <h1>آخر تحديثات مسار</h1>
  <p>تابع آخر ما تمت إضافته وتحديثه في مسار ليصلك الجديد أولاً بأول</p>
</div>

<div class="list" id="list"></div>

<div class="continue-wrap">
  <a href="home.html" class="continue-btn">الدخول إلى المكتبة ←</a>
</div>

<script>
window.signOut = () => {
  localStorage.removeItem('msar_auth');
  window.location.href='index.html';
};
(function(){
  const raw = localStorage.getItem('msar_auth');
  if(!raw){ window.location.href='index.html'; return; }
  try{
    const auth = JSON.parse(raw);
    if(!auth.email || !auth.code){ window.location.href='index.html'; return; }
    if(auth.expires && new Date(auth.expires) < new Date()){
      localStorage.removeItem('msar_auth');
      window.location.href='index.html'; return;
    }
  } catch(e){ window.location.href='index.html'; }
})();

fetch('new-models.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('list');
    if(!data || data.length === 0){
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✅</div>
          <p>لا توجد إضافات جديدة حالياً<br>تابعنا قريباً لآخر الموديلات</p>
        </div>`;
      return;
    }
    list.innerHTML = data.map(item => `
      <a href="${item.u}" class="model-card">
        <span class="model-name"><span class="new-badge">جديد</span>${item.n}</span>
        <span class="model-brand">${item.b}</span>
      </a>`).join('');
  })
  .catch(() => {
    document.getElementById('list').innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <p>تعذّر تحميل آخر التحديثات</p>
      </div>`;
  });
</script>
</body>
</html>
