<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار PRO — المكتبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html{visibility:hidden}
:root{--bg:#060d1f;--card:#0d1630;--border:#1a3360;--blue:#2563eb;--blue-light:#3b82f6;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Tajawal',sans-serif;color:var(--text);min-height:100vh}
.topbar{background:#0a1020;border-bottom:2px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:900;color:#fff}.logo span{color:var(--blue-light)}
.logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:7px;font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer}
.logout:hover{border-color:var(--blue-light);color:var(--blue-light)}
.section-title{padding:20px 20px 10px;font-size:12px;color:var(--blue-light);font-weight:700;letter-spacing:2px}
.brands-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px}
@media(min-width:600px){.brands-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.brands-grid{grid-template-columns:repeat(5,1fr)}}
.brand-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all 0.2s;text-decoration:none}
.brand-card:hover{border-color:var(--blue-light);transform:translateY(-2px);box-shadow:0 4px 20px rgba(37,99,235,0.2)}
.brand-icon{width:48px;height:48px;border-radius:12px;background:#152040;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand-name{font-size:15px;font-weight:700;color:var(--text)}
.brand-count{font-size:11px;color:var(--blue-light);background:rgba(37,99,235,0.1);padding:2px 8px;border-radius:10px}
.brand-count.soon{color:var(--muted);background:transparent}
.search-wrap{position:relative;padding:16px 20px 0}
.search-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none}
.search-box::placeholder{color:var(--muted)}
.search-box:focus{border-color:var(--blue-light)}
.search-results{position:absolute;top:100%;left:20px;right:20px;margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;max-height:360px;overflow-y:auto;z-index:50;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.45)}
.search-results.show{display:block}
.search-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);cursor:pointer}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#152040}
.search-item-name{font-size:14px;font-weight:700}
.search-item-brand{font-size:11px;color:var(--blue-light);background:rgba(37,99,235,0.12);padding:3px 10px;border-radius:10px;white-space:nowrap}
.search-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<script type="module" src="auth-guard.js"></script>
<div class="topbar">
  <div class="logo">مسار <span>PRO</span></div>
  <button class="logout" onclick="goToUpdates()">← التحديثات</button>
</div>
<div class="search-wrap">
  <input type="text" id="modelSearch" class="search-box" placeholder="🔍 ابحث عن اسم الموديل...">
  <div class="search-results" id="searchResults"></div>
</div>

<div class="section-title">اختر الماركة</div>
<div class="brands-grid">
  <a href="samsung.html" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Samsung</div>
    <div class="brand-count" id="count-samsung">...</div>
  </a>
  <a href="redmi.html" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Redmi</div>
    <div class="brand-count" id="count-redmi">...</div>
  </a>
  <a href="infinix.html" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Infinix</div>
    <div class="brand-count soon" id="count-infinix">قريباً</div>
  </a>
  <a href="tecno.html" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Tecno</div>
    <div class="brand-count soon" id="count-tecno">قريباً</div>
  </a>
  <a href="huawei.html" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Huawei</div>
    <div class="brand-count soon" id="count-huawei">قريباً</div>
  </a>
  <a href="#" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Realme</div>
    <div class="brand-count soon">قريباً</div>
  </a>
  <a href="#" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Vivo</div>
    <div class="brand-count soon">قريباً</div>
  </a>
  <a href="#" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Oppo</div>
    <div class="brand-count soon">قريباً</div>
  </a>
  <a href="#" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">Nokia</div>
    <div class="brand-count soon">قريباً</div>
  </a>
  <a href="#" class="brand-card">
    <div class="brand-icon">📱</div>
    <div class="brand-name">iPhone</div>
    <div class="brand-count soon">قريباً</div>
  </a>
</div>

<script>
window.goToUpdates = () => {
  window.location.href='updates.html';
};

(function(){
  const raw = localStorage.getItem('msar_auth');
  if(!raw){ window.location.href='index.html'; return; }
  try{
    const auth = JSON.parse(raw);
    if(!auth.email || !auth.code){ window.location.href='index.html'; return; }
    if(auth.expires && new Date(auth.expires) < new Date()){
      localStorage.removeItem('msar_auth');
      window.location.href='index.html'; return;
    }
  } catch(e){ window.location.href='index.html'; }
})();

// دالة عامة: تحسب مجموع كل الموديلات الحقيقية في أي صفحة ماركة
// (تتجاهل أي رابط href="#" لأنه موديل لم يُضَف بعد)
async function countModels(file) {
  try {
    const res = await fetch(file + '?v=' + Date.now());
    const text = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const items = doc.querySelectorAll('.model-item');
    let count = 0;
    items.forEach(a => {
      const href = a.getAttribute('href');
      if (href && href !== '#' && href !== '') count++;
    });
    return count;
  } catch(e) {
    return null;
  }
}

async function updateCounts() {
  // 1. حساب موديلات سامسونج
  const samsungCount = await countModels('samsung.html');
  if(samsungCount !== null) {
    const el = document.getElementById('count-samsung');
    el.textContent = samsungCount + ' موديل';
    el.classList.remove('soon');
  }

  // 2. حساب موديلات ريدمي
  const redmiCount = await countModels('redmi.html');
  if(redmiCount !== null) {
    const el = document.getElementById('count-redmi');
    el.textContent = redmiCount + ' موديل';
    el.classList.remove('soon');
  }

  // 3. حساب موديلات انفينكس
  const infinixCount = await countModels('infinix.html');
  if(infinixCount !== null && infinixCount > 0) {
    const el = document.getElementById('count-infinix');
    el.textContent = infinixCount + ' موديل';
    el.classList.remove('soon');
  }

  // 4. حساب موديلات تكنو
  const tecnoCount = await countModels('tecno.html');
  if(tecnoCount !== null && tecnoCount > 0) {
    const el = document.getElementById('count-tecno');
    el.textContent = tecnoCount + ' موديل';
    el.classList.remove('soon');
  }

  // 5. حساب موديلات هواوي
  const huaweiCount = await countModels('huawei.html');
  if(huaweiCount !== null && huaweiCount > 0) {
    const el = document.getElementById('count-huawei');
    el.textContent = huaweiCount + ' موديل';
    el.classList.remove('soon');
  }
}


// ============ البحث عن الموديلات ============
let searchIndex = [];
fetch('search-index.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => { searchIndex = data; })
  .catch(() => {});

const searchInput = document.getElementById('modelSearch');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    searchResults.classList.remove('show');
    searchResults.innerHTML = '';
    return;
  }
  const matches = searchIndex.filter(item => item.n.toLowerCase().includes(q)).slice(0, 30);
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="search-empty">لا توجد نتائج</div>';
  } else {
    searchResults.innerHTML = matches.map(item =>
      `<a href="${item.u}" class="search-item"><span class="search-item-name">${item.n}</span><span class="search-item-brand">${item.b}</span></a>`
    ).join('');
  }
  searchResults.classList.add('show');
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    searchResults.classList.remove('show');
  }
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchResults.classList.remove('show');
    searchInput.blur();
  }
});

updateCounts();
</script>
</body>
</html>
